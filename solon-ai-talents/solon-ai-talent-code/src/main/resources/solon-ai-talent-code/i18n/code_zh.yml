  ### 模块 (Module): {module} (Flutter/Dart)
  - 依赖: `cd {module} && flutter pub get`
  - 全量测试: `cd {module} && flutter test`
  - 单文件测试: `cd {module} && flutter test path/to/test_file.dart`

code.lang.php.type: |-
  PHP 项目
code.lang.php.root: |-
  ### 根项目 (PHP/Composer)
  - 依赖: `composer install`
  - 全量测试: `./vendor/bin/phpunit`
  - 单文件测试: `./vendor/bin/phpunit path/to/TestFile.php` (替换为实际路径)
code.lang.php.module: |-
