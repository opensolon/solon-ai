  - 全量测试: `cd {module} && ./vendor/bin/phpunit`
  - 单文件测试: `cd {module} && ./vendor/bin/phpunit path/to/TestFile.php`

code.lang.dotnet.type: |-
  C# 项目
code.lang.dotnet.root: |-
  ### 根项目 (C#/.NET)
  - 还原: `dotnet restore`
  - 构建: `dotnet build`
  - 全量测试: `dotnet test`
  - 单测执行: `dotnet test --filter FullyQualifiedName=Namespace.ClassName` (替换为实际类名)
code.lang.dotnet.module: |-
  ### 模块 (Module): {module} (C#/.NET)
  - 还原: `cd {module} && dotnet restore`
  - 构建: `cd {module} && dotnet build`
  - 全量测试: `cd {module} && dotnet test`
  - 单测执行: `cd {module} && dotnet test --filter FullyQualifiedName=Namespace.ClassName` (替换为实际类名)
