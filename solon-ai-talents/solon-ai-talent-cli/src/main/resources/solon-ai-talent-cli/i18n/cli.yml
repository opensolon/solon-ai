  Error: {message}
terminal.exec.empty: |-
  Error: the command is empty
terminal.sandbox.disabled: |-
  Error: the OS sandbox is not enabled; the command was refused
terminal.sandbox.unavailable: |-
  Error: the OS sandbox is unavailable; the command was refused: {error}
terminal.windows.prepare_failed: |-
  Error: could not prepare the Windows execution plan: {error}
terminal.path.missing: |-
  Error: the path does not exist
terminal.ls.empty: |-
  (empty directory)
terminal.ls.denied: |-
  [access denied]
terminal.read.missing: |-
  Error: the file does not exist
terminal.read.binary: |-
  Error: the file is binary and cannot be read as text.
terminal.read.empty: |-
  (the file is empty)
terminal.read.dir: |-
  Error: the target is a directory and cannot be read
terminal.read.line_truncated: |-
  …(line too long, truncated)
terminal.read.offset_out: |-
  Error: the start line ({line}) is beyond the end of the file.
terminal.read.more: |-
  --- [more content] ---
terminal.read.char_limit: |-
  Warning: the content was truncated because of the physical length limit of a single read ({kb}KB).
terminal.read.line_limit: |-
  Hint: the limit of lines you specified has been reached.
terminal.read.next: |-
  To continue reading, use the parameters: offset={offset}
terminal.read.done: |-
  --- [end of file] ---
terminal.write.ok: |-
  File written: {path}
terminal.edit.missing: |-
  Error: the file does not exist and cannot be edited.
terminal.edit.empty_old: |-
  Precheck failed (operation {op}): old_str must not be empty. Make sure to pass old_str when calling edit, specifying the original text block to replace.
terminal.edit.all_missing: |-
  Precheck failed (operation {op}): replace-all found no match. Make sure the content of old_str exists in the file (indentation and whitespace differences are ignored).
terminal.edit.mismatch: |-
  Precheck failed (operation {op}): content mismatch — {diag}. Check whether old_str matches the file.
terminal.edit.not_unique: |-
  Precheck failed (operation {op}): the text block does not match exactly at the given old_StrStartLine and is not unique in the file. Provide the correct old_StrStartLine or add context lines.
terminal.edit.apply_failed: |-
  Execution failed (operation {op}): {error}. An earlier edit may have broken the matching context here; try calling edit several times instead.
terminal.edit.ok: |-
  File {path}: {count} edit(s) applied.
terminal.vedit.empty_old: |-
  Precheck failed (operation {op}): old_str must not be empty.
terminal.vedit.mismatch: |-
  Precheck failed (operation {op}): content mismatch.
terminal.vedit.all_missing: |-
  Precheck failed (operation {op}): replace-all found no match.
terminal.grep.none: |-
  No results found.
terminal.grep.truncated: |-
  Warning: too many search results; truncated at the {kb}KB limit. Narrow the search path or keywords.
terminal.grep.skipped_large: |-
  Skipped {count} file(s) exceeding the per-file read limit (10MB).
terminal.glob.none: |-
  No matching files found.
terminal.vfile.too_large: |-
  Error: the virtual file exceeds the per-file read limit (10MB); narrow the file scope.
terminal.search.separator: |-
  Error: the path of {tool} accepts only a single directory, but the separator '{sep}' was found (current value: {path}). Call it several times, or use the common parent directory of these directories and narrow the scope with pattern/include.
terminal.search.missing: |-
  Error: the path does not exist ({tool} path={path}). Check the directory levels with ls first; note that path accepts only a single directory and must not contain wildcards (wildcards belong in pattern).
terminal.validate.home: |-
  Error: sandboxAllowUserHome is disabled; ~ paths are not allowed.
terminal.validate.empty: |-
  Error: command must not be empty.
terminal.validate.kill: |-
  Error: dangerous command detected. Never try to stop the host process (PID: {pid}).
terminal.validate.exit: |-
  Error: high-risk command detected. By security policy, exit, system restarts and deletion of the root or system directories are forbidden.
terminal.validate.rm_windows: |-
  Error: high-risk command detected. Deleting a drive root or system directories (Windows / Program Files / Users, etc.) is forbidden.

