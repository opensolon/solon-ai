# ---- Edit matching (exception messages and diagnostics) ----
terminal.apply.empty_old: |-
  old_str must not be empty
terminal.apply.all_missing: |-
  The text block to replace was not found
terminal.apply.missing: |-
  The text block was not found. This usually happens because an earlier edit changed the character offsets or content of the file; apply the edits step by step
terminal.apply.not_unique: |-
  The text block is not unique in the current state
terminal.diag.no_content: |-
