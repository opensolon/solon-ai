# ======== ProcessExecutor ========
executor.no_cmd: |-
  Execution failed: no runnable command found (Command not found)
executor.code_failed: |-
  Code execution failed: {error}
executor.timeout: |-
  Execution timed out: running time exceeded {ms} ms (process tree terminated).
executor.timeout_output: |-
  --- output produced before the timeout ---
executor.size_capped: |-
  ... [output exceeded the physical limit of {bytes} bytes; the command was terminated. Narrow the output (for example, add filters or paging), or redirect it to a file and view it in parts]
executor.ok: |-
  Executed successfully
executor.interrupted: |-
  Execution interrupted (process tree terminated)
executor.system_failed: |-
  System failure: {error}
executor.omitted: |-
  ... [{count} characters omitted in the middle] ...
executor.binary_readable: |-
  [Note: binary traits were detected in the output, but most of it is readable, so it was decoded for display]
executor.binary_size: |-
  (original size: {bytes} bytes)
executor.binary_title: |-
  [Binary output detected; the garbled body was omitted]
executor.binary_summary: |-
  About {bytes} bytes, first {count} bytes: {hex}
executor.binary_summary_typed: |-
  About {bytes} bytes, detected type: {type}, first {count} bytes: {hex}
executor.binary_hint: |-
  Hint: the command output looks like binary content. To view details, use a suitable tool instead (such as jar tf, unzip -l, javap, file, xxd) or decode (or decompress) it properly before printing.
executor.binary_hint_typed: |-
  Hint: the command output looks like binary content ({type}). To view details, use a suitable tool instead (such as jar tf, unzip -l, javap, file, xxd) or decode (or decompress) it properly before printing.
executor.truncated: |-
  ... [output too large, truncated: {total} characters in total, {omitted} characters omitted in the middle, only the head and tail kept. For the full content, read it page by page with the read tool, or redirect the output to a file and process it there] ...
