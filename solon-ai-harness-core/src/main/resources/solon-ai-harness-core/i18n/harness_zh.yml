# solon-ai-harness-core 文案（中文）
# 约定：值一律写成 "|-" 块标量，只写正文——值的首尾不留换行或空格（段落之间的换行、空格由代码负责）；占位符用 {name}；禁止出现 ${ 与 #{
# 协议性前缀（"ERROR: "、"WARNING: "、"[OK] "）由代码补，不写进文案

# ---- 子代理（task / task_start / task_wait / task_stop）----
task.description: |-
  子代理调度专家：将复杂任务拆解并委派给专项子代理（如 explore, plan, bash 等），互不依赖的任务可在后台并行。
task.instruction.agents_title: |-
  ## 当前可用的子代理
task.instruction.session_agents_title: |-
  ## 本会话专用的子代理（仅当前会话可用，同样通过 task / task_start 调用）
task.instruction.strategy: |-
  ## 任务分配策略：
  1. **优先并行**: 当任务可以被拆分为互不干扰的独立单元（例如：不同的模块开发、多路搜索）时，用 `task_start` 在后台逐个启动（每次一个任务），再用 `task_wait` 收回结果；只有一个任务时直接用 `task`。
  2. **原子性**: 每个任务应具备明确的边界。
  3. **上下文感知**: 必须在 prompt 中提供任务所需的全部背景，子代理无法看到主会话的完整历史。
  4. **接着做**: 结果里的 `task_id` 可用来接着该任务做（子代理保留之前的上下文）：失败时带上它从断点重试，完成后也可带上它追问或补充要求；`failure_kind` 为 `rate_limit`、`upstream_unavailable` 表示子代理内部已重试过，请减少同时启动的任务或稍后再试，短时间内反复失败就结束本轮并告知用户。
  5. **后台任务**: 启动后可以做与之不冲突的工作（不要改它们正在处理的文件），没有别的事可做就调用 `task_wait`，不要轮询。给出最终回答前，必须收回或停止全部后台任务：本轮结束时未收回的会被取消（之后仍可用 `task_id` 接着做）。
task.error.nested_task: |-
  子代理不允许再委派任务（最多一层）。请直接完成当前任务，或把需要的内容整理进 prompt 后自行执行。
task.error.load_failed: |-
  子代理 '{name}' 定义加载失败: {error}
task.error.unknown_agent: |-
  未知的子代理类型 '{name}'。
task.error.parent_paused: |-
  主代理已暂停
task.error.no_response: |-
  子代理未正常完成：未收到正常响应
task.error.failed: |-
  任务执行失败: {error}
task.stopped.cancelled: |-
  任务未完成（主流程已取消，未等待）
task.stopped.interrupted: |-
  任务未完成（已中断，未等待）
task.not_started.cancelled: |-
  主流程已取消，任务未启动
task.not_started.interrupted: |-
  执行被中断，任务未启动
task.result.spilled: |-
  ...[内容过长已截断：原始长度 {length} 字符，此处保留前 {kept} 字符；完整结果已落盘到 {path}，可按需分页读取该文件，不要重新委派该任务]
task.result.truncated: |-
  ...[内容过长已截断，原始长度 {length} 字符]
task.resume.not_found: |-
  任务 {task_id} 不存在或已过期，无法接着做，请重新委派。
task.resume.busy: |-
  任务 {task_id} 仍在执行中，请等它结束后再接着做。
task.start.hint: |-
  任务已在后台运行。用 task_wait 取回结果（不带 task_id 时返回最先完成的一个），需要时用 task_stop 停止。本轮结束时未取回的后台任务会被取消。
task.start.queued_hint: |-
  任务已排队（并发已满），有空位时自动开始。用 task_wait 取回结果（不带 task_id 时返回最先完成的一个），需要时用 task_stop 停止。本轮结束时未取回的后台任务会被取消。
task.wait.none: |-
  本轮没有待取回的后台任务。
task.wait.timeout: |-
  等待超时，任务仍在后台运行。当前状态：
task.async.unknown: |-
  本轮没有后台任务 {task_id}（可能已随之前的轮次结束，或 ID 有误）。如需接着做，请用 task 或 task_start 带上该 task_id。
task.stop.done: |-
  已按要求停止。

# ---- 子代理生成（generate）----
generate.error.bad_name: |-
  name 标识符不合法，仅允许使用英文字符、数字、下划线或中划线。
generate.error.reserved: |-
  '{name}' 是保留名，请换一个名字。
generate.error.global_exists: |-
  已存在同名的全局子代理，不覆盖：{name}
generate.error.global_denied: |-
  当前环境不允许创建全局子代理。请改用 saveToFile=false（仅本会话可用）。
generate.error.file_exists: |-
  代理定义文件已存在，不覆盖：{path}
generate.error.no_session: |-
  缺少会话上下文，无法创建仅本会话可用的子代理。
generate.error.conflict_global: |-
  与全局子代理同名：{name}，请换一个名字。
generate.error.session_full: |-
  本会话已有同名子代理，或会话级子代理数量已达上限（{max}）。
generate.error.failed: |-
  创建子代理失败: {error}
generate.ok: |-
  子代理创建成功（{scope}）！

  **标识**: {name}
  **描述**: {description}

  现在可以使用 `task(name="{name}", prompt="...")` 来调用。
generate.scope.global: |-
  全局
generate.scope.session: |-
  仅本会话

# ---- 人工介入（HITL）----
hitl.path_traversal: |-
  检测到路径回溯操作，禁止访问工作区外目录。
hitl.sensitive_file: |-
  禁止访问系统敏感配置文件。
hitl.bash.injection: |-
  检测到潜在的命令注入或设备重定向风险。
hitl.bash.privileged: |-
  检测到系统特权指令 [{command}]。
hitl.bash.incomplete: |-
  检测到不完整的命令或空命令。
hitl.bash.deny: |-
  操作被权限策略拒绝。
hitl.bash.ask: |-
  高危操作，需要人工介入确认。
hitl.write.deny: |-
  文件写入操作被权限策略拒绝。
hitl.write.ask: |-
  文件写入操作，需要人工介入确认。
hitl.web.risky: |-
  检测到高风险域名 [{host}]，拒绝访问。
hitl.web.unknown_host: |-
  未知
hitl.web.deny: |-
  网络访问操作被权限策略拒绝。
hitl.web.ask: |-
  网络访问操作，需要人工介入确认。

