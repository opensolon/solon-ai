# ---- 项目规范（AGENTS.md）----
project_rules.description: |-
  项目规范：工作区里的 AGENTS.md（主代理与所有子代理共用）
project_rules.source: |-
  规范来源：{path}
project_rules.truncated: |-
  （已截断，完整内容请用 read 读取 `{path}`）
project_rules.update.removed: |-
  来自 {path} 的规范不再适用。
project_rules.update.added: |-
  新增规范：
project_rules.update.changed: |-
  规范有变化，最新内容：
project_rules.update.all_removed: |-
  之前加载的规范均不再适用。
