command.disabled: |-
  已停用。发送 /help 查看可用命令。
command.session_required: |-
  需要会话才能执行，请在会话中使用。
command.scope_denied: |-
  命令不可用：{command}
command.help.description: |-
  查看可用命令；/help <命令> 查看详情
command.help.title: |-
