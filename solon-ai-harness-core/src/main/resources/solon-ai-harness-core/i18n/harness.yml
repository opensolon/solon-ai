# solon-ai-harness-core messages (English, fallback)
# Conventions: every value is a "|-" block scalar with body text only - no leading/trailing newline or space (separators are added by code); placeholders use {name}; "${" and "#{" are not allowed
# Protocol prefixes ("ERROR: ", "WARNING: ", "[OK] ") are added by code, not written here

# ---- Subagents (task / task_start / task_wait / task_stop) ----
task.description: |-
  Subagent dispatcher: breaks complex tasks down and delegates them to specialized subagents (such as explore, plan, bash); independent tasks can run in parallel in the background.
task.instruction.agents_title: |-
  ## Available Subagents
task.instruction.session_agents_title: |-
  ## Session-only Subagents (available in this session only; also invoked via task / task_start)
task.instruction.strategy: |-
  ## Task Assignment Strategy:
  1. **Prefer parallelism**: When a task can be split into independent units that do not interfere with each other (e.g., developing different modules, searching multiple sources), start each one in the background with `task_start` (one task per call), then collect the results with `task_wait`. For a single task, just use `task`.
  2. **Atomicity**: Each task should have clear boundaries.
  3. **Context awareness**: The prompt must contain all the background the task needs; subagents cannot see the full history of the main session.
  4. **Continue a task**: The `task_id` in a result lets you continue that task (the subagent keeps its earlier context): after a failure, pass it to retry from where it stopped; after success, pass it to ask follow-up questions or add requirements. A `failure_kind` of `rate_limit` or `upstream_unavailable` means the subagent has already retried internally, so start fewer tasks at once or try later, and if it keeps failing, end this turn and tell the user.
  5. **Background tasks**: After starting them, you may do work that does not conflict with them (do not modify the same files they work on); when there is nothing else to do, call `task_wait`. Do not poll. Before giving the final answer, collect or stop every background task: when this turn ends, the ones not collected are cancelled (their `task_id` can still be continued later).
task.error.nested_task: |-
  Subagents are not allowed to delegate further tasks (one level at most). Complete the current task directly, or put what you need into the prompt and do it yourself.
task.error.load_failed: |-
  Failed to load the definition of subagent '{name}': {error}
task.error.unknown_agent: |-
  Unknown subagent type '{name}'.
task.error.parent_paused: |-
  The main agent has been paused
task.error.no_response: |-
  The subagent did not complete normally: no valid response was received
task.error.failed: |-
  Task execution failed: {error}
task.stopped.cancelled: |-
  Task not completed (the main flow was cancelled; not waited for)
task.stopped.interrupted: |-
  Task not completed (interrupted; not waited for)
task.not_started.cancelled: |-
  The main flow was cancelled; the task was not started
task.not_started.interrupted: |-
  Execution was interrupted; the task was not started
task.result.spilled: |-
  ...[Content too long and truncated: original length {length} characters, the first {kept} characters are kept here; the full result has been saved to {path}. Read that file page by page as needed, and do not delegate this task again]
task.result.truncated: |-
  ...[Content too long and truncated, original length {length} characters]
task.resume.not_found: |-
  Task {task_id} does not exist or has expired and cannot be continued; delegate it anew.
task.resume.busy: |-
  Task {task_id} is still running; wait until it ends before continuing it.
task.start.hint: |-
  The task is running in the background. Use task_wait to collect its result (without task_id it returns whichever finishes first) and task_stop to stop it. Background tasks not collected when this turn ends are cancelled.
task.start.queued_hint: |-
  The task is queued (the concurrency limit is reached) and starts automatically when a slot frees up. Use task_wait to collect its result (without task_id it returns whichever finishes first) and task_stop to stop it. Background tasks not collected when this turn ends are cancelled.
task.wait.none: |-
  There are no background tasks to collect in this turn.
task.wait.timeout: |-
  Timed out waiting; the tasks keep running in the background. Current status:
task.async.unknown: |-
  Background task {task_id} does not exist in this turn (it may have ended with an earlier turn, or the id is wrong). To continue it, call task or task_start with this task_id.
task.stop.done: |-
  Stopped as requested.

# ---- Subagent generation (generate) ----
generate.error.bad_name: |-
  Invalid name: only English letters, digits, underscores and hyphens are allowed.
generate.error.reserved: |-
  '{name}' is a reserved name; please choose another one.
generate.error.global_exists: |-
  A global subagent with the same name already exists and will not be overwritten: {name}
generate.error.global_denied: |-
  Creating global subagents is not allowed in the current environment. Use saveToFile=false instead (available in this session only).
generate.error.file_exists: |-
  The agent definition file already exists and will not be overwritten: {path}
generate.error.no_session: |-
  Missing session context; cannot create a session-only subagent.
generate.error.conflict_global: |-
  Same name as a global subagent: {name}; please choose another one.
generate.error.session_full: |-
  This session already has a subagent with the same name, or the number of session subagents has reached the limit ({max}).
generate.error.failed: |-
  Failed to create the subagent: {error}
generate.ok: |-
  Subagent created ({scope})!

  **Name**: {name}
  **Description**: {description}

  You can now call it with `task(name="{name}", prompt="...")`.
generate.scope.global: |-
  global
generate.scope.session: |-
  this session only

