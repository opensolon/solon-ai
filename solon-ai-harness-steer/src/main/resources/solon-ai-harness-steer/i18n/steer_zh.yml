# solon-ai-harness-steer 文案（中文）
# 约定：值一律写成 "|-" 块标量，只写正文——值的首尾不留换行或空格（段落之间的换行、空格由代码负责）；占位符用 {name}；禁止出现 ${ 与 #{

# ---- 注入协议（结尾空格由代码补；识别时匹配所有已知语言）----
steer.prefix: |-
  [用户实时补充]

# ---- /steer 命令 ----
command.steer.description: |-
  向正在执行的任务插入实时补充（插话）
command.steer.example_1: |-
  /steer 补充一个要求：顺便更新 README
command.steer.example_2: |-
  /steer 注意别改动测试代码
command.steer.usage: |-
  用法：/steer <补充内容>（在任务执行中向当前任务插入实时补充）
command.steer.applied: |-
  已插话，将在下一步注入当前任务（待生效 {pending} 条）
command.steer.disabled: |-
  插话能力已停用，可直接发送或使用 /queue 排队
command.steer.box_full: |-
  插话邮箱已满（上限 {max} 条），可用 /queue 排队
command.steer.not_running: |-
  当前无正在执行的任务可插话，可直接发送或用 /queue 排队
command.steer.too_long: |-
  插话内容过长（上限 {max} 字符）
command.steer.failed: |-
  插话未生效：{reason}
