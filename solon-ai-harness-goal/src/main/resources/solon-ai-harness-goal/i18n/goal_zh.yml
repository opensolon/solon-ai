# solon-ai-harness-goal 文案（中文）
# 约定：值一律写成 "|-" 块标量，只写正文——值的首尾不留换行或空格（段落之间的换行、空格由代码负责）；占位符用 {name}；禁止出现 ${ 与 #{
# 协议性前缀（"error [no-executor]: "、"(exit=N): "）由代码补，不写进文案

# ---- 工具返回值（错误 JSON 的 message）----
goal.tool.no_goal: |-
  未找到目标
goal.tool.status_required: |-
  status 参数必填（complete 或 blocked）
goal.tool.no_session: |-
  无活跃会话
goal.tool.no_active_goal: |-
  未找到活跃目标
goal.tool.not_active: |-
  目标不在活跃状态（{status}），无法更新
goal.tool.action_evidence_required: |-
  目标尚未完成：本轮没有成功的实际工具操作。请先创建、修改、运行或验证目标产物；goal_get/goal_update 不算执行证据。
goal.tool.todo_unfinished: |-
  目标尚未完成：任务清单还有 {count} 项未完成（`- [ ]` 或 `- [/]`）。请先完成或用 todowrite 更新清单状态后再调用 goal_update(complete)。
goal.tool.validation_failed: |-
  目标尚未完成：验证失败 - {detail}。请继续改进后重新调用 goal_update(complete)。
goal.tool.unknown_status: |-
  未知状态 '{status}'. 仅支持 'complete' 或 'blocked'.

# ---- 轮次提示词：完整模式 ----
goal.prompt.full.continuation: |-
  --- 目标延续 (Goal Continuation) ---
  你正在朝向以下目标工作: {objective}
  你的目标是完成此任务。这是持续性的工作 — 每一轮执行都是同一个目标的延续。
goal.prompt.full.evidence: |-
  --- 证据驱动 (Evidence-Based) ---
  不要依赖记忆或假设来判断当前状态。在采取行动前，先检查实际的文件内容、
  测试结果、构建输出等客观证据。你的判断必须基于最新的事实，而非上轮的记忆。
goal.prompt.full.fidelity: |-
  --- 忠于目标 (Goal Fidelity) ---
  不要缩小目标范围或降低完成标准。目标中的每一项都必须完成。
  不要留占位符、TODO 或 stub。如果某个部分很难，要投入精力解决，而非跳过。
goal.prompt.full.audit: |-
  --- 审计完成 (Audit Check) ---
  在继续之前，请完成以下步骤：
  1. 回顾：目标是什么？检查已有的进展。
  2. 核查：针对目标中的每一项，通过运行测试、检查文件等客观手段验证其是否已完成。
     不要仅凭推理 — 必须有权威证据（测试通过、构建成功、文件存在且内容正确）。
     对创建、修改、运行类目标，至少完成一次实际工具操作；goal_get/goal_update 不算执行证据。
  3. 如果你已完成所有项，说明你是如何实现每一项的，
     然后调用 goal_update(complete) 标记完成。
goal.prompt.full.blocked: |-
  --- 阻塞审计 (Blocked Audit) ---
  如果你遇到阻碍（同一困境尝试了 3 次），调用 goal_update(blocked) 声明阻塞。
  不要因为工作困难、进展慢或不确定就声明阻塞 — 仅当同一问题反复尝试仍无法解决时才使用。
  resume 后阻塞计数重置为 0。
goal.prompt.stagnation: |-
  --- 进展质疑 (Stagnation Check) ---
  系统检测到最近 {count} 轮执行未产生实质性进展。
  请认真评估：你是否在同一问题上反复尝试但无法推进？
  如果是，请调用 goal_update(blocked) 声明阻塞。
  如果不是，请在下一步采取明显不同的策略。
goal.prompt.error.header: |-
  --- 错误警告 (Error Warning) ---
  最近连续 {count} 次执行遇到相同类型的错误：
  - 错误类型: {type}
goal.prompt.error.summary: |-
  - 错误摘要: {summary}
goal.prompt.error.ssl: |-
  - 这是 SSL/TLS 证书验证错误，属于运行环境问题，无法通过重试或更换 URL 解决。
  - 请使用 websearch 或 codesearch 工具替代 webfetch 来获取信息。
goal.prompt.error.http_4xx: |-
  - 这是 HTTP 4xx 客户端错误（如 404/403/401），通常表示资源不存在或无权限。
  - 重试相同请求不会成功，请更换目标 URL 或使用其他工具。
goal.prompt.error.network: |-
  - 这是网络连接错误，可能是临时性的。
  - 可以稍后重试，但如果连续多次失败请换用其他策略。
goal.prompt.error.tool_execution: |-
  - 工具调用执行失败。请分析错误原因，考虑换用其他工具或调整参数。
goal.prompt.error.other: |-
  - 请分析错误原因，如果同一问题已尝试 3 次以上，请调用 goal_update(blocked)。
goal.prompt.urgent: |-
  [紧急] 你的 Token 预算即将耗尽。请专注于高效完成目标。
goal.prompt.last_summary.title: |-
  --- 上一轮执行摘要（第 {iteration} 轮）---
goal.prompt.last_summary.hint: |-
  请基于以上进展继续推进，避免重复已尝试过的方案。

# ---- 轮次提示词：精简模式 / 极简模式 ----
goal.prompt.compact.continuation: |-
  --- 目标延续 (Goal Continuation) ---
  目标: {objective}
  持续工作直至完成。完成后调用 goal_update(complete) 标记完成。
goal.prompt.compact.audit: |-
  --- 审计完成 (Audit Check) ---
  逐条验证目标完成情况。必须有客观证据（测试通过/文件存在）。不要凭推理判定完成。
  创建、修改、运行类目标必须有实际工具操作，goal_get/goal_update 不算执行证据。
goal.prompt.compact.last: |-
  上一轮（第 {iteration}轮）: {summary}
goal.prompt.minimal.objective: |-
  目标: {objective}
goal.prompt.minimal.instruction: |-
  持续工作直至完成。执行型目标必须先产生实际工具证据，goal_get/goal_update 不算。完成后调用 goal_update(complete)；连续 3 轮无进展则调用 goal_update(blocked)。

# ---- 轮次提示词：预算耗尽收尾 ----
goal.prompt.budget_limit.header: |-
  --- 预算耗尽 (Budget Limit) ---
  你的目标 Token 预算已耗尽。
goal.prompt.budget_limit.objective: |-
  目标: {objective}
goal.prompt.budget_limit.title: |-
  预算:
goal.prompt.budget_limit.elapsed: |-
  - 耗时: {elapsed}
goal.prompt.budget_limit.consumed: |-
  - 已消耗: {consumed}
goal.prompt.budget_limit.instruction: |-
  系统已将此目标标记为 budget_limited，请勿开始新的实质性工作。
  请在此轮回复中：
  1. 总结已完成的工作和进展
  2. 列出剩余未完成的工作
  3. 给出明确的下一步建议
goal.prompt.budget_limit.no_update: |-
  不要调用 goal_update 除非目标确实已完成。

# ---- 轮次提示词：预算与轮次信息 ----
goal.prompt.budget.consumed: |-
  已消耗 {consumed} / {max} ({percent}%)
goal.prompt.budget.remaining: |-
  (剩余: {remaining})
goal.prompt.budget.warning: |-
  [预算提示] 已使用 {percent}%，请评估是否需要调整策略或申请扩容
goal.prompt.budget.consumed_unlimited: |-
  已消耗 Token: {consumed}
goal.prompt.budget.elapsed: |-
  耗时: {elapsed}
goal.prompt.iteration: |-
  轮次限制: 当前为第 {current} / {max} 轮，本轮结束后最多还可执行 {remaining} 轮。请优先完成并验证目标，不要把关键工作留到限制之后。
goal.prompt.truncated: |-
  ...(省略)...

# ---- 轮次结果记录（写入目标的 lastResult）----
goal.round.unclaimed: |-
  本轮未被执行器认领，目标无法推进。
goal.round.completion_rejected: |-
  完成声明被拒绝：本轮没有实际工具执行证据，请继续完成并验证目标。

# ---- 执行型目标关键词（"|" 分隔，按小写匹配；识别时合并所有语言）----
goal.action_keywords: |-
  生成|创建|新建|编写|写入|修改|编辑|修复|实现|添加|删除|重构|构建|测试|运行|安装|配置|部署|文件

# ---- 门面与命令的冲突说明 ----
goal.error.active_exists: |-
  当前会话已有进行中的 Goal，请先清除后再创建
goal.error.terminal_edit: |-
  已完成的 Goal 不能编辑，请先清除

# ---- 验证说明 ----
goal.validate.error: |-
  验证器异常: {error}
goal.validate.no_result: |-
  验证器无结果
goal.validate.unable: |-
  无法完成验证（{detail}）
goal.validate.workdir_empty: |-
  工作目录为空，无法验证
goal.validate.detect_failed: |-
  探测项目类型失败: {error}
goal.validate.run_failed: |-
  执行 '{command}' 失败: {error}
goal.validate.run_no_result: |-
  执行 '{command}' 无结果
goal.validate.run_timed_out: |-
  执行 '{command}' 超时
goal.validate.tests_failed: |-
  测试未通过
goal.validate.build_failed: |-
  编译失败
goal.validate.unknown_project: |-
  未检测到已知的项目类型 (pom.xml / package.json / build.gradle / setup.py)

# ---- /goal 命令 ----
command.goal.description: |-
  设置并追踪会话目标（每会话一个）
command.goal.usage_example: |-
  /goal 修复登录模块的鉴权缺陷
